<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ruta farmacias</title>
<style>
  :root{--bg:#0f1720;--card:#18232f;--line:#2a3a4a;--txt:#e8eef4;--mut:#8aa0b4;--acc:#2ecc71;--urg:#ff6b5b;
        --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;max-width:600px;min-height:100dvh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.35;
       padding:calc(14px + var(--st)) calc(14px + var(--sr)) calc(96px + var(--sb)) calc(14px + var(--sl))}
  h1{font-size:clamp(1.25rem,5vw,1.6rem);margin:2px 0}
  p.sub{color:var(--mut);margin:0 0 12px;font-size:.95rem}
  /* 16px en campos: evita que el iPhone haga zoom al tocar */
  textarea,input[type=text]{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
  textarea{min-height:38dvh;resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--acc);border-color:transparent}
  label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
  .hint{color:var(--mut);font-size:.85rem;margin-top:6px}
  button,a.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:54px;border:0;border-radius:14px;
       padding:12px;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
  button:active,a.btn:active{transform:scale(.98)}
  button:disabled{opacity:.6}
  .pri{background:var(--acc);color:#04210f}
  .sec{background:var(--line);color:var(--txt)}
  /* Barra de botones fija abajo, a mano del pulgar */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;max-width:600px;margin:0 auto;
       padding:10px calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl));
       background:linear-gradient(to top,var(--bg) 75%,transparent)}
  .barra > *{flex:1}
  #estado{margin:14px 0 8px;color:var(--mut);min-height:1.3em;font-size:.95rem}
  ol{padding:0;margin:0;list-style:none;counter-reset:n}
  li{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;counter-increment:n;
     display:grid;grid-template-columns:32px 1fr auto;gap:4px 10px;align-items:start}
  li::before{content:counter(n);grid-row:1 / span 3;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#04210f;font-weight:800;display:grid;place-items:center}
  li.urg::before{background:var(--urg);color:#fff}
  li b{grid-column:2;word-break:break-word}
  li .t{grid-column:2;color:var(--mut);font-size:.88rem}
  li .d{grid-column:2;color:var(--mut);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  li a.ir{grid-column:3;grid-row:1 / span 3;align-self:center;background:var(--line);color:var(--txt);text-decoration:none;
     border-radius:12px;padding:0 14px;min-height:44px;display:grid;place-items:center;font-weight:700;font-size:.95rem}
  .err{color:var(--urg)}
  .oculto{display:none!important}
  /* Pantallas muy estrechas */
  @media (max-width:360px){ body{padding-left:10px;padding-right:10px} li{grid-template-columns:28px 1fr} li a.ir{grid-column:2;grid-row:auto;margin-top:6px} }
  /* Móvil en horizontal: textarea más bajo */
  @media (max-height:480px){ textarea{min-height:120px} }
</style>
</head>
<body>
<h1>🚗 Ruta farmacias</h1>
<p class="sub">Un destino por línea y te los ordeno desde donde estás.</p>

<section id="entrada">
<textarea id="destinos" enterkeyhint="enter" autocapitalize="sentences" placeholder="Farmacia López, Calle Colón 20, Valencia
!Av. del Puerto 150, Valencia
Calle Sueca 45, Valencia
Plaza de la Reina 1, Valencia
Calle Mayor 10, Paterna"></textarea>
<div class="hint">Pon <b>!</b> delante si es urgente: va primero. Calle, número y pueblo = menos fallos.</div>

<label for="ciudad">Ciudad por defecto (si no pones pueblo)</label>
<input type="text" id="ciudad" value="Valencia" autocomplete="address-level2">
</section>

<div id="estado" aria-live="polite"></div>
<ol id="lista"></ol>

<div class="barra">
  <button class="sec oculto" id="editar">✏️ Editar</button>
  <button class="pri" id="go">📍 Organizar desde aquí</button>
  <a class="btn pri oculto" id="maps" target="_blank" rel="noopener">🗺️ Abrir en Maps</a>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
// Recordar lo último escrito
$('destinos').value = store.get('rf_destinos') || '';
$('ciudad').value = store.get('rf_ciudad') || 'Valencia';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const estado = (t, err) => { $('estado').innerHTML = err ? `<span class="err">${t}</span>` : t; };

function miUbicacion(){
  return new Promise((ok, ko) => {
    if(!navigator.geolocation) return ko(new Error('Este navegador no da la ubicación'));
    navigator.geolocation.getCurrentPosition(
      p => ok({lat:p.coords.latitude, lon:p.coords.longitude}),
      e => ko(new Error('No pude leer tu ubicación (¿GPS activado y permiso dado?)')),
      {enableHighAccuracy:true, timeout:15000}
    );
  });
}

async function geocodificar(texto, ciudad, cerca){
  const cache = store.get('rf_geo') || {};
  const q = /,/.test(texto) || !ciudad ? texto : `${texto}, ${ciudad}`;
  if(cache[q]) return cache[q];
  const vb = cerca ? `&viewbox=${cerca.lon-0.6},${cerca.lat+0.6},${cerca.lon+0.6},${cerca.lat-0.6}` : '';
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es${vb}&q=${encodeURIComponent(q)}`;
  const r = await fetch(url, {headers:{'Accept-Language':'es'}});
  if(!r.ok) throw new Error('Fallo buscando direcciones');
  const j = await r.json();
  await sleep(1100); // Nominatim pide máx 1 petición/segundo
  if(!j.length) return null;
  const res = {lat:+j[0].lat, lon:+j[0].lon, nombre:j[0].display_name};
  cache[q] = res; store.set('rf_geo', cache);
  return res;
}

async function matrizTiempos(puntos){
  const coords = puntos.map(p => `${p.lon},${p.lat}`).join(';');
  const r = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration,distance`);
  if(!r.ok) throw new Error('Fallo calculando tiempos en coche');
  const j = await r.json();
  if(j.code !== 'Ok') throw new Error('El servidor de rutas no respondió bien');
  return {t:j.durations, d:j.distances};
}

// Mejor orden: prueba todas las combinaciones (vale de sobra hasta 8-9 paradas)
function mejorOrden(M, indices, inicio){
  let mejor = null, mejorCoste = Infinity;
  const usado = new Array(indices.length).fill(false), act = [];
  (function rec(pos, coste){
    if(coste >= mejorCoste) return;
    if(act.length === indices.length){ mejorCoste = coste; mejor = act.slice(); return; }
    for(let i=0;i<indices.length;i++){
      if(usado[i]) continue;
      const nxt = indices[i];
      usado[i]=true; act.push(nxt);
      rec(nxt, coste + M[pos][nxt]);
      act.pop(); usado[i]=false;
    }
  })(inicio, 0);
  return {orden:mejor, coste:mejorCoste};
}

// Para listas largas: vecino más cercano + mejora 2-opt
function heuristica(M, indices, inicio){
  const quedan = new Set(indices), orden = [];
  let pos = inicio;
  while(quedan.size){
    let b=null, bc=Infinity;
    for(const i of quedan) if(M[pos][i] < bc){bc=M[pos][i]; b=i;}
    orden.push(b); quedan.delete(b); pos=b;
  }
  const coste = o => { let c=0,p=inicio; for(const i of o){c+=M[p][i];p=i;} return c; };
  let mejora = true;
  while(mejora){
    mejora=false;
    for(let i=0;i<orden.length-1;i++) for(let k=i+1;k<orden.length;k++){
      const n = orden.slice(0,i).concat(orden.slice(i,k+1).reverse(), orden.slice(k+1));
      if(coste(n) < coste(orden)-1){ orden.splice(0, orden.length, ...n); mejora=true; }
    }
  }
  return {orden, coste:coste(orden)};
}

const fmtMin = s => s < 3600 ? `${Math.round(s/60)} min` : `${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`;
const fmtKm = m => `${(m/1000).toFixed(1)} km`;

const ver = (id, si) => $(id).classList.toggle('oculto', !si);
function modoEditar(){
  ver('entrada',true); ver('go',true); ver('editar',false); ver('maps',false);
  $('lista').innerHTML=''; estado('');
}
function modoRuta(){
  ver('entrada',false); ver('go',false); ver('editar',true); ver('maps',true);
  window.scrollTo({top:0,behavior:'smooth'});
}
$('editar').onclick = modoEditar;

$('go').onclick = async () => {
  $('lista').innerHTML=''; ver('maps',false);
  $('go').disabled = true; document.activeElement && document.activeElement.blur();
  const ciudad = $('ciudad').value.trim();
  const lineas = $('destinos').value.split('\n').map(s=>s.trim()).filter(Boolean);
  store.set('rf_destinos', $('destinos').value); store.set('rf_ciudad', ciudad);
  if(lineas.length < 1){ $('go').disabled=false; return estado('Escribe al menos un destino.', true); }
  if(lineas.length > 23){ $('go').disabled=false; return estado('Máximo 23 destinos de golpe.', true); }

  try{
    estado('📍 Buscando tu ubicación…');
    const yo = await miUbicacion();

    const destinos = [];
    for(let i=0;i<lineas.length;i++){
      const urg = lineas[i].startsWith('!');
      const texto = lineas[i].replace(/^!+\s*/,'');
      estado(`🔎 Buscando dirección ${i+1}/${lineas.length}: ${texto}`);
      const g = await geocodificar(texto, ciudad, yo);
      if(!g) return estado(`No encuentro "${texto}". Ponle calle, número y pueblo y vuelve a probar.`, true);
      destinos.push({texto, urg, ...g});
    }

    estado('🧮 Calculando el mejor orden…');
    const puntos = [yo, ...destinos];
    const {t, d} = await matrizTiempos(puntos);
    const idx = destinos.map((_,i)=>i+1);
    const urg = idx.filter(i=>destinos[i-1].urg), norm = idx.filter(i=>!destinos[i-1].urg);
    const resolver = (ids, ini) => ids.length===0 ? {orden:[]} : (ids.length<=8 ? mejorOrden(t, ids, ini) : heuristica(t, ids, ini));

    const r1 = resolver(urg, 0);
    const ultimo = r1.orden.length ? r1.orden[r1.orden.length-1] : 0;
    const r2 = resolver(norm, ultimo);
    const orden = [...r1.orden, ...r2.orden];

    let prev=0, totT=0, totD=0, html='';
    for(const i of orden){
      const p = destinos[i-1];
      totT += t[prev][i]; totD += d[prev][i];
      html += `<li class="${p.urg?'urg':''}"><b>${p.urg?'🚨 ':''}${p.texto}</b>
        <div class="t">🚗 ${fmtMin(t[prev][i])} · ${fmtKm(d[prev][i])} desde la anterior</div>
        <div class="d">${p.nombre}</div>
        <a class="ir" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving" target="_blank" rel="noopener">Ir ➜</a></li>`;
      prev = i;
    }
    $('lista').innerHTML = html;
    estado(`✅ ${orden.length} paradas · ${fmtMin(totT)} de coche en total · ${fmtKm(totD)}`);

    const ll = p => `${p.lat},${p.lon}`;
    const paradas = orden.map(i=>destinos[i-1]);
    const destino = paradas[paradas.length-1];
    const wps = paradas.slice(0,-1).map(ll).join('|');
    $('maps').href = `https://www.google.com/maps/dir/?api=1&origin=${ll(yo)}&destination=${ll(destino)}`
      + (wps ? `&waypoints=${encodeURIComponent(wps)}` : '') + '&travelmode=driving';
    modoRuta();
  }catch(e){
    estado(e.message || 'Algo ha fallado', true);
  }finally{
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
